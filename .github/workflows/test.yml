name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile src/telegram_notify.py telegram_notify.py scripts/install.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate JSON and shell scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m json.tool integrations/codex/hooks.json >/dev/null
          python -m json.tool integrations/claude/settings.fragment.json >/dev/null
          sh -n install.sh
          sh -n bin/telegram-notify
